name: Charter

on:
  pull_request:

permissions:
  contents: read

jobs:
  charter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: true
      - run: go mod download
      - uses: oleg-koval/charter@v0.2.0
        with:
          version: v0.2.0
          report: github
          dir: .charter
