name: Charter

on:
  pull_request:

permissions:
  contents: read

jobs:
  charter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: true
      - run: go mod download
      - name: Save pull request body for Charter
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > .charter/pr-body.md
      - uses: oleg-koval/charter@v0.1.2
        with:
          version: v0.1.2
          dir: .charter
          pr-body-file: .charter/pr-body.md
