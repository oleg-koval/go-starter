repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        language: system
        entry: bash -c 'make fmt && git diff --exit-code'
        pass_filenames: false
        types: [go]

      - id: go-lint
        name: golangci-lint
        language: system
        entry: make lint
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        language: system
        entry: make test
        pass_filenames: false
        types: [go]

      - id: file-length-check
        name: file length ≤ 300 lines
        language: system
        entry: bash scripts/check-file-length.sh
        types: [go]
        pass_filenames: true
        exclude: "(\\.pb\\.go|_gen\\.go)$"
